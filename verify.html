<!DOCTYPE html>
<html lang="en" class="bg-background">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Verification Check | Legal Metrology Verify</title>
  <meta name="description" content="Check whether a shop scale, fuel dispenser, or measuring instrument is currently verified under the Legal Metrology Act." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .verify-hero { background: linear-gradient(160deg, var(--primary-700), var(--primary)); color: #fff; padding: 40px 0 92px; }
    .verify-hero .container-narrow { padding: 0 24px; }
    .verify-hero h1 { font-size: 30px; font-weight: 750; letter-spacing: -0.02em; }
    .verify-hero p { color: rgba(255,255,255,.82); margin-top: 8px; font-size: 15px; }
    .lift { margin-top: -66px; }
    .checkbox-card { padding: 20px; }
    .checkbox-card form { display: flex; gap: 10px; }
    .checkbox-card .search { max-width: none; }
    .samples { margin-top: 14px; font-size: 12.5px; color: var(--ink-muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .chip { background: var(--surface-2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; }
    .chip:hover { background: var(--surface-3); }

    /* Certificate result */
    .cert { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); background: var(--surface); }
    .cert-band { padding: 20px 24px; color: #fff; display: flex; align-items: center; gap: 16px; }
    .cert-band.ok { background: linear-gradient(120deg, #0c6644, var(--ok)); }
    .cert-band.due { background: linear-gradient(120deg, #8a5407, var(--warn)); }
    .cert-band.expired { background: linear-gradient(120deg, #8f221b, var(--danger)); }
    .cert-band.pending { background: linear-gradient(120deg, #414f63, #5b6b82); }
    .cert-band .cb-ico { width: 52px; height: 52px; border-radius: 13px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
    .cert-band .cb-ico svg { width: 28px; height: 28px; }
    .cert-band h2 { font-size: 22px; font-weight: 750; letter-spacing: -0.01em; }
    .cert-band p { color: rgba(255,255,255,.85); font-size: 13.5px; margin-top: 2px; }
    .cert-body { padding: 24px; }
    .cert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 26px; }
    .cf label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 700; }
    .cf div { font-size: 15px; font-weight: 600; margin-top: 3px; }
    .cert-foot { padding: 16px 24px; border-top: 1px dashed var(--border-strong); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface-2); }
    .expiry-note { font-size: 13px; }
    .qr { width: 74px; height: 74px; border-radius: 10px; background: #fff; padding: 6px; border: 1px solid var(--border-strong); flex: none; }
    .qr svg { width: 100%; height: 100%; display: block; }
    .not-found { text-align: center; padding: 40px 24px; }
    .not-found .nf-ico { width: 56px; height: 56px; border-radius: 14px; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; margin: 0 auto 14px; }
    .not-found .nf-ico svg { width: 28px; height: 28px; }
    .guide { margin-top: 22px; }
    .guide-item { display: flex; gap: 13px; padding: 15px 0; border-bottom: 1px solid var(--border); }
    .guide-item:last-child { border-bottom: none; }
    .guide-item .gi { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; flex: none; }
    .guide-item h4 { font-size: 14px; font-weight: 650; }
    .guide-item p { font-size: 13px; color: var(--ink-muted); }
    @media (max-width: 720px) { .cert-grid { grid-template-columns: 1fr; } .checkbox-card form { flex-direction: column; } }
  </style>
</head>
<body>
  <div id="appbar"></div>

  <section class="verify-hero">
    <div class="container-narrow">
      <h1>Is this instrument verified?</h1>
      <p>Enter the certificate number or the serial printed on the verification sticker to check its live status.</p>
    </div>
  </section>

  <div class="container-narrow lift" style="padding: 0 24px 60px;">
    <div class="card checkbox-card">
      <form id="checkForm" role="search">
        <div class="search">
          <span id="cIcon"></span>
          <input id="cInput" type="text" placeholder="Certificate no. or serial (e.g. WM-PN-4471)" aria-label="Certificate or serial number" autocomplete="off" />
        </div>
        <button class="btn btn-primary" type="submit">Check status</button>
      </form>
      <div class="samples">
        <span>Try:</span>
        <span class="chip" data-s="WM-PN-4471">WM-PN-4471</span>
        <span class="chip" data-s="FD-MB-8831">FD-MB-8831</span>
        <span class="chip" data-s="TM-NS-1191">TM-NS-1191</span>
      </div>
    </div>

    <div id="result" class="mt-3"></div>
  </div>

   <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    UI.mountAppbar("verify.html", null);
    document.getElementById("cIcon").innerHTML = UI.icon("search");

    const resultEl = document.getElementById("result");
    const input = document.getElementById("cInput");

    function render(inst, query) {
      if (!inst) {
        resultEl.innerHTML = `
          <div class="card not-found">
            <div class="nf-ico">${UI.icon("xCircle")}</div>
            <h2 style="font-size:19px;font-weight:700;">No record found</h2>
            <p class="muted" style="max-width:420px;margin:6px auto 0;">We couldn&apos;t find an instrument matching
            <b class="mono">${query || ""}</b>. Check the number, or the instrument may not yet be registered for verification.</p>
            <p class="muted" style="margin-top:12px;font-size:13px;">If a trader is using an unregistered instrument, you can report it to the local Legal Metrology office.</p>
          </div>`;
        return;
      }
      const status = LM.statusOf(inst);
      const meta = { verified: { t: "Verified & Valid", d: "This instrument passed verification and is currently certified." },
        due: { t: "Verified — Renewal Due", d: "Still valid, but re-verification is due within 30 days." },
        expired: { t: "Expired — Not Compliant", d: "Certification has lapsed. This instrument must be re-verified before use." },
        pending: { t: "Not Yet Verified", d: "This instrument is registered but has no active certification." } }[status];
      const days = LM.daysToExpiry(inst);
      let note = "";
      if (status === "verified") note = `<span class="badge badge-ok"><span class="dot"></span>${days} days remaining</span>`;
      else if (status === "due") note = `<span class="badge badge-warn"><span class="dot"></span>Due in ${days} days</span>`;
      else if (status === "expired") note = `<span class="badge badge-danger"><span class="dot"></span>Expired ${Math.abs(days)} days ago</span>`;
      else note = `<span class="badge badge-neutral"><span class="dot"></span>Awaiting verification</span>`;

      const bandClass = status === "verified" ? "ok" : status;
      resultEl.innerHTML = `
        <div class="cert">
          <div class="cert-band ${bandClass}">
            <div class="cb-ico">${UI.icon(status === "expired" ? "alert" : status === "due" ? "clock" : status === "pending" ? "clock" : "shield")}</div>
            <div><h2>${meta.t}</h2><p>${meta.d}</p></div>
          </div>
          <div class="cert-body">
            <div class="cert-grid">
              <div class="cf"><label>Instrument type</label><div>${inst.type}</div></div>
              <div class="cf"><label>Serial number</label><div class="mono">${inst.serial}</div></div>
              <div class="cf"><label>Certificate number</label><div class="mono">${inst.certNo || "—"}</div></div>
              <div class="cf"><label>Make / model</label><div>${inst.model}</div></div>
              <div class="cf"><label>Trader / establishment</label><div>${inst.shop || inst.traderName}</div></div>
              <div class="cf"><label>Location</label><div>${inst.district}</div></div>
              <div class="cf"><label>Last verified</label><div>${UI.fmtDate(inst.lastVerified)}</div></div>
              <div class="cf"><label>Valid until</label><div>${UI.fmtDate(inst.expiry)}</div></div>
              <div class="cf"><label>Verified by inspector</label><div>${inst.inspectorName || "—"}</div></div>
              <div class="cf"><label>Capacity / range</label><div>${inst.capacity}</div></div>
            </div>
          </div>
          <div class="cert-foot">
            <div class="row gap-sm">
              <div class="qr" role="img" aria-label="Verification QR code">${UI.qr(inst.serial)}</div>
              <div class="expiry-note">
                <div class="faint" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;">Status</div>
                ${note}
              </div>
            </div>
            <button class="btn btn-ghost" onclick="window.print()">${UI.icon("print")} Print record</button>
          </div>
        </div>

        <div class="card guide mt-3">
          <div class="card-pad">
            <h3 style="font-size:14px;font-weight:650;margin-bottom:4px;">What this means for consumers</h3>
            <div class="guide-item">
              <span class="gi ico-green">${UI.icon("check")}</span>
              <div><h4>Verified</h4><p>The instrument was tested within tolerance limits and is safe to transact with.</p></div>
            </div>
            <div class="guide-item">
              <span class="gi ico-amber">${UI.icon("clock")}</span>
              <div><h4>Due soon</h4><p>Still valid, but the trader should apply for re-verification shortly.</p></div>
            </div>
            <div class="guide-item">
              <span class="gi ico-red">${UI.icon("alert")}</span>
              <div><h4>Expired</h4><p>Do not rely on readings. You may report continued use to the Legal Metrology office.</p></div>
            </div>
          </div>
        </div>`;
    }

    function doCheck(q) {
      const query = (q != null ? q : input.value).trim();
      if (!query) { UI.toast("Enter a serial or certificate number", "danger"); return; }
      input.value = query;
      render(LM.findInstrument(query), query);
      resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    document.getElementById("checkForm").addEventListener("submit", (e) => { e.preventDefault(); doCheck(); });
    document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => doCheck(c.dataset.s)));

    // Prefill from ?q=
    const params = new URLSearchParams(location.search);
    if (params.get("q")) doCheck(params.get("q"));
  </script>
</body>
</html>
